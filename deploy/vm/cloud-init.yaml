#cloud-config
# Ubuntu 24.04 bootstrap for the dedicated 9router VM (used by provision.sh).
# Installs Docker CE + compose/buildx from Docker's apt repo, caps container
# logs, keeps containers running across dockerd restarts, adds swap headroom for
# the Next.js build, and enables unattended security upgrades.

# Key-only root SSH, same operating model as onara (deploy.sh connects as root).
disable_root: false
ssh_pwauth: false

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
  - unattended-upgrades

write_files:
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "50m", "max-file": "5" },
        "live-restore": true
      }
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/sysctl.d/90-9router.conf
    permissions: "0644"
    content: |
      vm.swappiness = 10
      net.core.somaxconn = 4096
      net.ipv4.tcp_keepalive_time = 120

runcmd:
  - [sh, -c, 'install -m 0755 -d /etc/apt/keyrings']
  - [sh, -c, 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc && chmod a+r /etc/apt/keyrings/docker.asc']
  - [sh, -c, 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list']
  - [sh, -c, 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin']
  - [systemctl, enable, --now, docker]
  - [sh, -c, 'if [ ! -f /swapfile ]; then fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo "/swapfile none swap sw 0 0" >> /etc/fstab; fi']
  - [sysctl, --system]
  - [sh, -c, 'mkdir -p /srv/9router /srv/traefik && touch /var/lib/cloud/instance/9router-bootstrap-done']
