# Traefik edge proxy on the dedicated VM, mirroring /srv/traefik on onara.
# Shipped to /srv/traefik by deploy/vm/deploy.sh. The public dashboard router is
# opt-in: docker-compose.dashboard.yaml is layered on only when
# TRAEFIK_DASHBOARD_HOST is set in the secrets' traefik.env.
services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command: --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./acme.json:/etc/traefik/acme.json
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro

networks:
  # Created by deploy.sh; 9router's netns container joins it too.
  default:
    name: traefik
    external: true
