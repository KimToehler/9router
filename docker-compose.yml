services:
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      # headroom shares this container's network namespace (network_mode:
      # service:9router below), so its :8787 is reachable on loopback. Loopback
      # is REQUIRED: the new headroom image gates /v1/compress behind a
      # loopback-only guard (127.0.0.1/::1/localhost host + Host header), so a
      # cross-container http://headroom:8787 call would 404 and silently skip
      # compression. Same-netns + 127.0.0.1 passes the guard.
      HEADROOM_URL: http://127.0.0.1:8787
      # RTK tool_result compression caps (RTK_*) are set in .env (already loaded
      # via env_file above) so they can be retuned without a tracked-file diff.
      # See .env.example for the documented knobs + defaults.
      # Per-call cap on the /v1/compress request (default 3000ms). Raised to
      # catch the occasional big-turn spike on a slow VM; fail-open still leaves
      # the body untouched if it's exceeded. Paired with HEADROOM_MODE=cache
      # below, which keeps compress cost ~constant so this rarely fires.
      HEADROOM_TIMEOUT_MS: "12000"
    # No `depends_on: headroom` here. With headroom on network_mode:
    # service:9router, Docker already orders 9router BEFORE headroom (headroom
    # needs 9router's netns). Declaring the reverse dep too makes a cycle. It is
    # also unnecessary: the /v1/compress call is fail-open (headroom.js returns
    # null and forwards the body untouched on any error), so 9router serves
    # correctly whether or not headroom is up yet.

  headroom:
    image: rg.nl-ams.scw.cloud/onara/headroom:latest
    container_name: headroom
    restart: always
    # Share 9router's network namespace so headroom's :8787 is on the SAME
    # loopback 9router sees. Required because the new image's /v1/compress is
    # loopback-guarded (see HEADROOM_URL note on the 9router service). A service
    # using network_mode: service:<x> must NOT declare its own `ports:` — the
    # namespace (and any published ports) belongs to 9router. 8787 stays
    # internal; nothing external needs it (the guard 404s non-loopback anyway).
    network_mode: "service:9router"
    environment:
      HEADROOM_HOST: "0.0.0.0"
      HOME: /home/nonroot
      # --- Compression posture: max savings WITHOUT accuracy loss -----------
      # Profiles in this image: agent-90, balanced, coding, general.
      # We use "coding" (the image's out-of-box agent posture). Unlike the old
      # "agent-90" (proxy_mode=token, force_kompress=true, compresses system
      # messages — aggressive/lossy, busts the upstream prompt-prefix cache),
      # "coding" is accuracy-first: proxy_mode=cache (delta-only, ~0 cache
      # busts), lossless-first structural compaction, code-aware AST ON, and
      # protect_reads ON (never lossy-compresses a file read). Savings emerge
      # from lossless + relevance rather than a hard target ratio.
      HEADROOM_SAVINGS_PROFILE: coding
      # Code-aware (AST) compression is BUILT IN to this image (Dockerfile
      # HEADROOM_EXTRAS=proxy,code). The old "Code-Aware: NOT INSTALLED" banner
      # is gone; the "coding" profile already enables it. Left unset = on.
      # KEEP cache mode: delta-only compression freezes prior turns and
      # compresses just the newest observation, so the upstream prompt-prefix
      # cache stays intact (~0 cache busts). "coding" already implies cache
      # mode; HEADROOM_MODE=cache is set explicitly as belt-and-suspenders.
      HEADROOM_MODE: cache
      # --- Host-sizing knobs (8-core server) --------------------------------
      # Bound the CPU-bound compression threadpool. Unset defaults to
      # cpu_count (=8) — i.e. one worker per core, which under concurrent
      # Claude Code sessions oversubscribes the box against the Node/9router
      # runtime sharing this netns. 6 leaves ~2 cores for 9router + the OS
      # while still absorbing bursts. Cancellation can't preempt a running
      # Rust worker (see models.py note), so a bounded pool also fails fast
      # under contention instead of piling threads unboundedly.
      HEADROOM_COMPRESSION_MAX_WORKERS: "6"
      # Per-message token floor for lossy "crush" compaction. Below this a
      # message is left byte-exact. The "coding" profile's setdefault is 25,
      # which crushes even small blocks (marginal savings, needless risk on
      # short tool outputs). 64 raises the floor so only genuinely large
      # observations (logs, file dumps, long tool results — the 100s–1000s
      # token blocks where savings live) get compacted. Explicit env overrides
      # the profile (agent_savings applies values via env.setdefault).
      HEADROOM_MIN_TOKENS: "64"
      # --- Persist the model + workspace across `docker compose pull` --------
      # fastembed / Kompress pull their ONNX models from the HuggingFace hub
      # cache (default ~/.cache/huggingface). That path is NOT on the workspace
      # volume, so every image recreate re-downloads them -> slow cold requests.
      # Point HF_HOME inside the persisted workspace volume so it survives.
      HEADROOM_WORKSPACE_DIR: /home/nonroot/.headroom
      HF_HOME: /home/nonroot/.headroom/hf
    volumes:
      - headroom-workspace:/home/nonroot/.headroom

  # ---------------------------------------------------------------------------
  # Optional memory backends (qdrant + neo4j) — COMMENTED OUT.
  # Headroom's memory feature is OFF by default (memory_enabled=False), so these
  # are NOT needed for compression or the timeout fix. neo4j is a JVM and heavy
  # on a small VM. Uncomment this block (and the qdrant env + volumes below) only
  # if you enable Headroom memory. NOTE: `headroom proxy` has no env/flag to
  # point memory at a remote neo4j (memory_neo4j_uri is hardcoded to
  # neo4j://localhost:7687) or select the qdrant-neo4j backend — full remote
  # memory needs the HEADROOM_PROXY_CONFIG_JSON escape hatch or a newer image.
  # ---------------------------------------------------------------------------
  # qdrant:
  #   image: qdrant/qdrant:v1.17.1
  #   container_name: 9router-qdrant
  #   restart: always
  #   environment:
  #     QDRANT__SERVICE__GRPC_PORT: "6334"
  #   volumes:
  #     - qdrant-data:/qdrant/storage
  #
  # neo4j:
  #   image: neo4j:5.26
  #   container_name: 9router-neo4j
  #   restart: always
  #   environment:
  #     NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/devpassword}
  #   volumes:
  #     - neo4j-data:/data
  #
  # And on the `headroom` service add:
  #     HEADROOM_QDRANT_HOST: qdrant
  #     HEADROOM_QDRANT_PORT: "6333"
  #     HEADROOM_QDRANT_GRPC_PORT: "6334"

volumes:
  9router-data:
    name: 9router-data
  headroom-workspace:
  # qdrant-data:
  # neo4j-data:
